# dsh-skill-doctor —— 技能体检
#
# 本组合包含三个组件行，插件页可以分别开关：
#   1) skill-doctor         —— 四个体检工具 + 斜杠命令（只读诊断）
#   2) skill-doctor-compat  —— 把 Claude Code / Codex / ZCode 的技能目录挂进 dsh
#   3) skill-doctor-gate    —— 插件页安装门禁（包装 installBundle）
# 三行各有自己的生命周期；关掉一行不影响另外两行。
#
# 第一行的 extraRoots 是「体检时临时扫一遍外部目录」（一次性，只影响报告），
# 与第二行的运行时挂载是两件事，别混用：
#   extraRoots:
#     - ~/.claude/skills
#
# 第二行默认三家全开、目录不存在静默跳过。不想默认挂载就把来源写成 false，
# 或直接在插件页关掉这一行。compat 不带热更新：改 SKILL.md 后需重启 dsh。
# 启用后体检报告也会包含导入技能；只想看原生技能时，在第一行加：
#   excludeProviders: [skill-doctor-compat]
#
- insert:
    - id: skill-doctor
      name: dsh-skill-doctor
      config:
        maxDescriptionLength: 500
        maxBodyTokens: 8000
        # installGate 已废弃：门禁现在是独立的组件行 skill-doctor-gate（见文件末尾），
        # 改用插件页上的开关控制。这里的键仍被接受但不再生效，只会打一条迁移提示。

    - id: skill-doctor-compat
      name: dsh-skill-doctor/compat
      config:
        sources:
          claude: true   # ~/.claude/skills + <项目根>/.claude/skills
          codex: true    # ~/.codex/skills
          zcode: true    # ~/.zcode/skills + <项目根>/.zcode/skills
        # providerName: skill-doctor-compat   默认，避免与 dsh-skill-compat-plus 撞名
        # slugifyNames: true                 外来名不合 dsh kebab 规则时自动转换
        # synthesizeDescription: true       Claude 允许缺省 description，从正文首段合成

    # 插件页安装门禁（第三行）。遇到「明知有风险但仍要装」的插件时，在插件页
    # 把这一行关掉再装，装完再打开即可——不用改配置文件、不用重启、也不必卸载
    # 整个插件。关掉它只影响插件页与模型工具发起的安装；`--gate` 命令行与
    # `/install` 命令属于主组件与 CLI，不随这一行启停，仍会审。
    - id: skill-doctor-gate
      name: dsh-skill-doctor/gate
